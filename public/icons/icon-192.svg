<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <radialGradient id="bgGrad192" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#14141c"/>
      <stop offset="100%" stop-color="#060608"/>
    </radialGradient>
    <radialGradient id="dotGlow192" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#EFA55C" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#EFA55C" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#EFA55C" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="dotGrad192" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE1BE"/>
      <stop offset="50%" stop-color="#EFA55C"/>
      <stop offset="100%" stop-color="#D97A2E"/>
    </linearGradient>
  </defs>
  
  <rect width="192" height="192" rx="44" fill="url(#bgGrad192)"/>
  <rect width="190" height="190" x="1" y="1" rx="43" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>
  
  <!-- Outer Glow Halo -->
  <circle cx="96" cy="96" r="56" fill="url(#dotGlow192)"/>
  
  <!-- Single Dot (تک‌نقطه) -->
  <circle cx="96" cy="96" r="24" fill="url(#dotGrad192)"/>
  
  <!-- Inner Specular Highlight -->
  <circle cx="90" cy="90" r="7" fill="#FFFFFF" opacity="0.35"/>
</svg>
