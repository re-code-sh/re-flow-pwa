<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad512" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#14141c"/>
      <stop offset="100%" stop-color="#060608"/>
    </radialGradient>
    <radialGradient id="dotGlow512" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#EFA55C" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#EFA55C" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#EFA55C" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="dotGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE1BE"/>
      <stop offset="50%" stop-color="#EFA55C"/>
      <stop offset="100%" stop-color="#D97A2E"/>
    </linearGradient>
  </defs>
  
  <rect width="512" height="512" rx="116" fill="url(#bgGrad512)"/>
  <rect width="508" height="508" x="2" y="2" rx="114" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="4"/>
  
  <!-- Outer Glow Halo -->
  <circle cx="256" cy="256" r="150" fill="url(#dotGlow512)"/>
  
  <!-- Single Dot (تک‌نقطه) -->
  <circle cx="256" cy="256" r="64" fill="url(#dotGrad512)"/>
  
  <!-- Inner Specular Highlight -->
  <circle cx="240" cy="240" r="18" fill="#FFFFFF" opacity="0.35"/>
</svg>
