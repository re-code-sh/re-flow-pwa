name = "flow"
main = "worker/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./dist"
binding = "ASSETS"

# To enable Cloudflare D1 Cloud Sync:
# 1. Create database: npx wrangler d1 create flow-db
# 2. Uncomment the binding below with your actual database_id:
# [[d1_databases]]
# binding = "DB"
# database_name = "flow-db"
# database_id = "<your-d1-database-id>"
